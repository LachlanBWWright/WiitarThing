name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: windows-2025
    timeout-minutes: 30

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore WiitarThing.sln -v:n

      - name: Build Debug
        run: dotnet build WiitarThing.sln -c Debug --no-restore -v:m

      - name: Build Release
        run: dotnet build WiitarThing.sln -c Release --no-restore -v:m

      - name: Build DebugLB
        run: dotnet build WiitarThing.sln -c DebugLB --no-restore -v:m

      - name: Build ReleaseLB
        run: dotnet build WiitarThing.sln -c ReleaseLB --no-restore -v:m

      - name: Test
        run: dotnet test Shared.Tests/Shared.Tests.csproj -c Release --no-build -v:m --collect:"XPlat Code Coverage"

      - name: Test application workflows
        run: dotnet test Application.Tests/Application.Tests.csproj -c Release --no-build -v:m --collect:"XPlat Code Coverage"

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: |
            Shared.Tests/TestResults/**/coverage.cobertura.xml
            Application.Tests/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Capture UI gallery
        shell: pwsh
        run: ./scripts/capture-ui-gallery.ps1 -Configuration Debug -NoBuild

      - name: Upload UI gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-gallery
          path: artifacts/ui-gallery/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Exception policy check
        shell: pwsh
        run: ./scripts/check-exception-policy.ps1
