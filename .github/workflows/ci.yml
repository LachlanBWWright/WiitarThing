name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: windows-latest

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore WiitarThing.sln -v:n

      - name: Build Debug
        run: dotnet build WiitarThing.sln -c Debug --no-restore -v:m

      - name: Build Release
        run: dotnet build WiitarThing.sln -c Release --no-restore -v:m

      - name: Build DebugLB
        run: dotnet build WiitarThing.sln -c DebugLB --no-restore -v:m

      - name: Build ReleaseLB
        run: dotnet build WiitarThing.sln -c ReleaseLB --no-restore -v:m

      - name: Test
        run: dotnet test Shared.Tests/Shared.Tests.csproj -c Release --no-build -v:m

      - name: Exception policy check
        shell: pwsh
        run: ./scripts/check-exception-policy.ps1

